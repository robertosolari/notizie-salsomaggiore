name: Novita del Comune

# Notizie ed eventi del Comune, eventi di Visit Salsomaggiore, agenda del venerdi'.
# Ogni ora dalle 05 alle 21 UTC, cioe' dalle 07 alle 23 italiane d'estate (un'ora
# prima d'inverno). Di notte il Comune non pubblica. Al minuto 17 e non allo scoccare
# dell'ora: allo :00 GitHub ha la coda piena e i giri programmati partono in ritardo.
on:
  schedule:
    - cron: '17 5-21 * * *'
  workflow_dispatch:
    inputs:
      pubblica_ultime:
        description: 'Solo per provare: pubblica comunque le ultime N notizie (0 = giro normale, massimo 5)'
        type: number
        default: 0
      agenda:
        description: "Pubblica adesso l'agenda del weekend, anche se non e' venerdi'"
        type: boolean
        default: false

permissions:
  contents: write

# Due giri sovrapposti pubblicherebbero due volte la stessa notizia.
concurrency:
  group: novita-comune
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ref: main e non il commit di lancio: un giro in coda deve vedere
      # l'elenco delle notizie gia' pubblicate aggiornato dal giro prima.
      - name: Scarica il repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Prepara Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Secret del repository, non di un ambiente: questo job gira 17 volte al
      # giorno e un ambiente creerebbe un deployment a ogni giro.
      - name: Controlla e pubblica
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CANALE: ${{ secrets.TELEGRAM_CANALE || vars.TELEGRAM_CANALE }}
          PUBBLICA_ULTIME: ${{ inputs.pubblica_ultime || 0 }}
          AGENDA: ${{ inputs.agenda && '1' || '' }}
        run: node tools/controlla.mjs

      # Si salva l'elenco delle notizie pubblicate anche se un messaggio e' fallito:
      # quelle uscite non devono ripartire al giro dopo.
      - name: Salva le notizie pubblicate
        if: always()
        run: |
          # status e non diff: al primo giro data/viste.json e' un file nuovo, che diff non vede.
          [ -z "$(git status --porcelain -- data/)" ] && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "Notizie pubblicate: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
